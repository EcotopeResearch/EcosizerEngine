[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoengine"
version = "3.2.0"
requires-python = ">=3.11"

# Ranges are bounded on purpose, and the shared ones are kept in sync with
# ecopipeline (DataPipelinePackage) and rcc-dash-viewer (RCCDashViewer, which
# depends on ecoengine directly).  All three get installed into the same
# long-lived environments, so an unbounded range lets a routine `pip install`
# pull a release that satisfies one package and breaks another.  Note that a
# clean resolution is not proof of a working environment: pandas 1.5.3 declared
# no numpy ceiling, so it resolved happily against numpy 2 and then failed at
# import with a binary-incompatibility ValueError.  That is what these bounds
# are for.  When bumping a shared range, bump it in all three repos together.
#
# scipy is not imported anywhere in this source tree.  It is required at runtime
# to unpickle the LinearNDInterpolator objects in data/preformanceMaps/pkls/,
# which PklPerformanceMap loads.  Do not remove it on the basis of an import
# scan.  The <2.0 ceiling is not precautionary: scipy.interpolate.interpnd is
# deprecated and is removed in SciPy 2.0, which will break those pickles.
# scipy also gates numpy indirectly — 1.16 requires numpy>=1.25.2 and 1.17
# requires numpy>=1.26.4 — so the scipy floor and the numpy floor move together.
#
# Verified against numpy 2.4.6 / scipy 1.17.1 / plotly 7.0.0: full test suite,
# all six performance-map pickles, and the to_plotly / plot_sizing_curve /
# write_html output paths.
dependencies = [
    "numpy>=2.4,<3.0",
    "scipy>=1.17,<2.0",
    "plotly>=7.0,<8.0",
]

[project.optional-dependencies]
docs = ["sphinx>=6", "furo"]

[dependency-groups]
dev = ["pytest", "build"]

[tool.setuptools.packages.find]
where = ["src"]
# The test suite imports pytest, which is a dev dependency.  Keep it out of the
# wheel so a production install does not carry a pytest-importing subpackage.
# Tests still run from the source tree (`uv run pytest`), which is what CI uses.
exclude = ["ecoengine.tests*"]

[tool.setuptools.package-data]
"ecoengine.data.climate_data" = ["*.csv"]
"ecoengine.data.load_shapes" = ["*.json"]
"ecoengine.data.preformanceMaps" = ["*.json"]
"ecoengine.data.preformanceMaps.pkls" = ["*.pkl"]

[tool.pytest.ini_options]
testpaths = ["src/ecoengine/tests"]
