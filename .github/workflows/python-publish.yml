# This workflow builds and uploads a Python Package when a release is created.
# Dependencies come from uv.lock so the tested tree matches the published one.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Install dependencies
      # --locked fails the build if uv.lock has drifted from pyproject.toml
      # rather than silently re-resolving.
      run: uv sync --locked
    - name: test package
      run: uv run pytest
    - name: Build package
      run: uv build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
